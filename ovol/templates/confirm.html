{% extends 'base.html' %}{% block content %}<section class="page-heading compact"><div><h1>{{ title }}</h1><p class="lead">{{ description }}</p></div></section><form class="panel form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>{{ label }}</h2>{% if needs_reason %}<label for="reason">Reason</label><textarea id="reason" name="reason" maxlength="500" rows="3" required>{{ request.form.get('reason','') }}</textarea>{% endif %}<div class="form-actions"><a class="button secondary" href="{{ url_for('reports.home') }}">Cancel</a><button class="destructive">Confirm {{ title|lower }}</button></div></form>{% endblock %}
