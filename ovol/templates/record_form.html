{% extends 'base.html' %}{% block content %}<section class="page-heading compact"><div><p class="eyebrow">STEP 02 / CORRECTION</p><h1>{{ title }}</h1></div></section><form class="panel form-panel wide" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if record %}<input type="hidden" name="revision" value="{{ record.revision }}"><pre class="source">{{ record.raw_text }}</pre>{% elif issue %}<input type="hidden" name="issue_id" value="{{ issue.id }}"><pre class="source">{{ issue.raw_text }}</pre>{% else %}<label for="line_no">Source line number</label><input type="number" id="line_no" name="line_no" min="1" required value="{{ request.form.get('line_no','1') }}">{% endif %}<div class="field-grid">{% for c in columns %}<div><label for="c_{{ c.id }}">{{ c.name }}{{ ' *' if c.required else '' }}</label><input id="c_{{ c.id }}" name="c_{{ c.id }}" maxlength="2000" value="{{ values.get(c.id,'') }}" {{ 'required' if c.required else '' }}><small class="hint">{{ c.data_type }}</small></div>{% endfor %}</div><label for="reason">Reason for change</label><textarea id="reason" name="reason" maxlength="500" rows="3" required>{{ request.form.get('reason','') }}</textarea><div class="form-actions"><a class="button secondary" href="{{ url_for('reports.detail',report_id=report.id) }}">Cancel</a><button>Save reviewed record</button></div></form>{% endblock %}
